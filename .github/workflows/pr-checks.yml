name: PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS: bullseye ships 3.9, bookworm 3.11, trixie 3.13
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax check
        run: python -m py_compile setup.py octoprint_piconsole/*.py

      - name: Version matches setup.py
        run: |
          set -euo pipefail
          plugin=$(grep -oP '__plugin_version__\s*=\s*"\K[^"]+' octoprint_piconsole/__init__.py)
          setup=$(grep -oP '^\s*version="\K[^"]+' setup.py)
          echo "__plugin_version__=$plugin setup.py=$setup"
          [ "$plugin" = "$setup" ]

      - name: Install pytest
        run: python -m pip install pytest

      - name: pytest
        run: python -m pytest -v tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JS syntax check
        run: node --check octoprint_piconsole/static/js/piconsole.js

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in octoprint_piconsole/default_scripts/*.sh; do
            bash -n "$f"
            echo "OK: $f"
          done

      - name: shellcheck (errors only)
        run: shellcheck -S error octoprint_piconsole/default_scripts/*.sh
